<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环球护照 · 旅行模拟 Global Passport</title>
<style>
:root{
  --bg:#12141a; --panel:#1c1f29; --panel2:#242836; --border:#3a4052;
  --text:#e8ecf4; --dim:#9aa3b5; --faint:#6b7280;
  --blue:#4fc3f7; --gold:#fdd835; --green:#66bb6a; --red:#ef5350; --orange:#ffa726;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ============ 开始界面 ============ */
#start-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;background:radial-gradient(ellipse at top,#1b2438 0%,#12141a 60%)}
#start-screen h1{font-size:3em;color:#fff;text-shadow:0 0 25px rgba(79,195,247,.8);margin-bottom:4px;letter-spacing:4px}
.sub{color:var(--dim);margin-bottom:6px;font-size:1.15em}
.hint{color:var(--faint);font-size:.85em;margin-bottom:24px}
.flag-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px;margin-bottom:14px}
.flag-card{width:130px;padding:12px 8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:.2s}
.flag-card:hover{border-color:var(--blue);transform:translateY(-3px)}
.flag-card.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(253,216,53,.5)}
.flag-dot{width:34px;height:24px;border-radius:4px;margin:0 auto 8px;border:1px solid rgba(255,255,255,.3)}
.flag-card b{display:block;font-size:.95em;margin-bottom:2px}
.flag-card small{color:var(--dim);font-size:.78em}
.hukou-row{display:flex;gap:8px;margin:10px 0 18px}
.hukou-btn{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:var(--panel2);color:var(--text)}
.hukou-btn.sel{border-color:var(--gold);background:rgba(253,216,53,.15)}
#btn-start{padding:14px 60px;font-size:1.25em;border:none;border-radius:30px;background:linear-gradient(135deg,#4fc3f7,#2979ff);color:#fff;font-weight:bold;box-shadow:0 4px 20px rgba(79,195,247,.4)}
#btn-start:hover{filter:brightness(1.1)}
#btn-continue{margin-top:12px;padding:10px 40px;font-size:1em;border-radius:30px;border:1px solid var(--gold);background:transparent;color:var(--gold)}
#btn-continue:hover{background:rgba(253,216,53,.12)}

/* ============ 游戏主界面 ============ */
#game-screen{padding:12px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 16px;margin-bottom:10px}
.topbar .title{font-size:1.2em;font-weight:bold;color:var(--blue);margin-right:8px}
.stat{font-size:.95em;color:var(--text);background:var(--panel2);padding:5px 12px;border-radius:16px}
.stat b{color:var(--gold)}
.spacer{flex:1}
.tbtn{padding:7px 14px;border-radius:18px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:.9em}
.tbtn:hover{border-color:var(--blue)}
.tbtn.gold{border-color:var(--gold);color:var(--gold)}

.main{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;height:calc(100vh - 90px);min-height:520px}
@media(max-width:1000px){.main{grid-template-columns:1fr;height:auto}}
.map-panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative}
.map-panel svg{width:100%;height:100%;display:block}
.side-panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:11px 0;text-align:center;background:transparent;border:none;color:var(--dim);font-size:.95em;border-bottom:2px solid transparent}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab-body{flex:1;overflow-y:auto;padding:14px}
.tab-body h3{margin-bottom:10px;color:var(--blue);font-size:1.05em}
.city-info{background:var(--panel2);border-radius:10px;padding:12px;margin-bottom:10px}
.city-info .nm{font-size:1.25em;font-weight:bold;color:var(--gold)}
.city-info .meta{color:var(--dim);font-size:.88em;margin-top:4px}
.btn{padding:9px 18px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:.95em;margin:4px 4px 4px 0}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:linear-gradient(135deg,#4fc3f7,#2979ff);border:none;color:#fff;font-weight:bold}
.btn.gold{background:linear-gradient(135deg,#fdd835,#f39c12);border:none;color:#222;font-weight:bold}
.btn.danger{background:linear-gradient(135deg,#ef5350,#d32f2f);border:none;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:5px 10px;font-size:.82em;border-radius:8px}

/* 出行列表 */
.dest-list{list-style:none;max-height:340px;overflow-y:auto}
.dest-list li{padding:9px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;cursor:pointer;background:var(--panel2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.dest-list li:hover{border-color:var(--blue)}
.dest-list li.sel{border-color:var(--gold);background:rgba(253,216,53,.08)}
.dest-list .dn{font-weight:bold}
.dest-list .dm{color:var(--faint);font-size:.8em;text-align:right}
.mode-row{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.mode-btn{padding:7px 12px;border-radius:18px;border:1px solid var(--border);background:var(--panel2);color:var(--dim);font-size:.85em}
.mode-btn.sel{border-color:var(--blue);color:var(--blue);background:rgba(79,195,247,.12)}
.purpose-row{display:flex;gap:6px;margin:8px 0}
.purpose-btn{padding:6px 12px;border-radius:16px;border:1px solid var(--border);background:var(--panel2);color:var(--dim);font-size:.82em}
.purpose-btn.sel{border-color:var(--green);color:var(--green)}

/* 签证列表 */
.visa-list{display:flex;flex-direction:column;gap:6px}
.visa-item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.visa-item .vn{font-weight:bold;display:flex;align-items:center;gap:8px}
.visa-dot{width:26px;height:18px;border-radius:3px;border:1px solid rgba(255,255,255,.25);display:inline-block}
.visa-item .vt{font-size:.78em;color:var(--faint)}
.visa-item.owned{opacity:.55}
.tag{font-size:.72em;padding:2px 8px;border-radius:10px;border:1px solid}
.tag.free{color:var(--green);border-color:var(--green)}
.tag.arrival{color:var(--orange);border-color:var(--orange)}
.tag.need{color:var(--red);border-color:var(--red)}
.tag.owned{color:var(--gold);border-color:var(--gold)}

/* 城市页 */
.landmark-box{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.landmark-box .lm{font-weight:bold;color:var(--orange)}
.action-btns{margin-top:6px}

/* 商店 */
.shop-item{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.shop-item h4{color:var(--gold);margin-bottom:4px}
.shop-item p{color:var(--dim);font-size:.85em;margin-bottom:8px}
.shop-item .cost{color:var(--orange);font-weight:bold}

/* ============ 模态 ============ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;max-width:860px;width:92%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 50px rgba(0,0,0,.6)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:1.2em;color:var(--blue)}
.modal-body{padding:18px 20px;overflow-y:auto}
.close-btn{border:none;background:transparent;color:var(--dim);font-size:1.6em;line-height:1}
.close-btn:hover{color:var(--red)}

/* 护照 */
.passport-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.passport-cover{background:linear-gradient(145deg,#1d4d2b,#0f351c);border:2px solid var(--gold);border-radius:14px;padding:18px;width:100%;max-width:520px}
.passport-cover .ptitle{color:var(--gold);font-weight:bold;text-align:center;letter-spacing:6px;margin-bottom:14px;font-size:1.1em}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{aspect-ratio:1.35;border:1px dashed rgba(255,255,255,.25);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:.72em;text-align:center;padding:4px;min-height:74px}
.cell .cd{width:100%;height:100%;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px}
.cell .cd b{font-size:1em}
.cell .cd small{font-size:.62em;opacity:.85;line-height:1.2;margin-top:2px;display:block}
.cell.empty{color:var(--faint)}
.cell.sel{border-color:var(--gold);box-shadow:0 0 12px rgba(253,216,53,.6)}
.passport-tip{color:var(--dim);font-size:.82em;line-height:1.7;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;width:100%;max-width:520px}
.passport-tip b{color:var(--gold)}

/* 挑战墙 */
.series-box{margin-bottom:12px}
.series-head{background:linear-gradient(145deg,#2d3347,#222639);padding:12px 16px;border-radius:10px 10px 0 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-bottom:none}
.series-head h3{color:var(--blue)}
.series-head .sc{color:var(--dim);font-size:.9em}
.series-body{padding:12px;background:#1a1d27;border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px}
.series-body.collapsed{display:none}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ach-card{background:linear-gradient(145deg,#262b3a,#1c1f2b);border:1px solid var(--border);border-radius:10px;padding:12px;opacity:.45;transition:.25s}
.ach-card.unlocked{opacity:1;border-color:var(--blue);box-shadow:0 0 12px rgba(79,195,247,.35)}
.ach-card .at{font-weight:bold;color:var(--dim);margin-bottom:4px;font-size:.95em}
.ach-card.unlocked .at{color:var(--blue)}
.ach-card .ad{font-size:.8em;color:var(--faint);line-height:1.45}
.ach-card .ic{font-size:1.5em;margin-bottom:6px;filter:grayscale(1)}
.ach-card.unlocked .ic{filter:none}

/* 入境检查模态 */
.entry-box{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.entry-box .big{font-size:1.3em;font-weight:bold;color:var(--gold);margin-bottom:4px}
.entry-box .pol{font-size:.95em;margin:6px 0;color:var(--text)}
.entry-box .fee{color:var(--orange);font-size:.9em}

/* 通知 */
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast-item{background:var(--panel2);border:1px solid var(--blue);color:var(--text);padding:10px 20px;border-radius:20px;font-size:.95em;box-shadow:0 4px 20px rgba(0,0,0,.5);animation:slideIn .3s}
.toast-item.ach{border-color:var(--gold);color:var(--gold);font-weight:bold}
.toast-item.err{border-color:var(--red);color:var(--red)}
@keyframes slideIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}

/* 胜利 */
#victory{position:fixed;inset:0;z-index:200;background:rgba(10,12,18,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#victory h1{font-size:3.2em;color:var(--gold);text-shadow:0 0 30px rgba(253,216,53,.8);margin-bottom:10px}
#victory p{color:var(--dim);font-size:1.15em;margin-bottom:26px}
.victory-badge{font-size:5em;margin-bottom:8px}

/* 滚动条 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#3a4052;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

.small-note{color:var(--faint);font-size:.78em;margin-top:8px}
</style>
</head>
<body>

<!-- ============ 开始界面 ============ -->
<div id="start-screen">
  <div style="font-size:4em;margin-bottom:6px">🌍</div>
  <h1>环球护照</h1>
  <div class="sub">Global Passport · 旅行模拟挑战</div>
  <div class="hint">选择你的护照，踏上环球之旅，完成 32 项史诗级旅行成就</div>
  <div style="color:var(--dim);font-size:.9em;margin-bottom:10px">选择出生地与护照</div>
  <div class="flag-row" id="flag-row"></div>
  <div id="hukou-wrap" class="hidden" style="text-align:center">
    <div style="color:var(--dim);font-size:.88em;margin-bottom:6px">选择户籍（影响部分成就）</div>
    <div class="hukou-row" id="hukou-row" style="justify-content:center"></div>
  </div>
  <button id="btn-start">✈️ 出发</button>
  <button id="btn-continue" class="hidden">继续上次旅程</button>
</div>

<!-- ============ 游戏主界面 ============ -->
<div id="game-screen" class="hidden">
  <div class="topbar">
    <span class="title">🌍 环球护照</span>
    <span class="stat">💰 <b id="s-money">0</b></span>
    <span class="stat">📅 <b id="s-date"></b></span>
    <span class="stat">📍 <b id="s-city"></b></span>
    <span class="stat">🏅 <b id="s-progress">0/32</b></span>
    <span class="spacer"></span>
    <button class="tbtn" onclick="openPassport()">📖 护照</button>
    <button class="tbtn gold" onclick="openChallenges()">🏆 挑战 <span id="s-progress2">0</span>/32</button>
    <button class="tbtn" onclick="saveGame()">💾 存档</button>
    <button class="tbtn" onclick="confirmNewGame()">🔄 重开</button>
  </div>
  <div class="main">
    <div class="map-panel" id="map-panel">
      <svg id="world-map" viewBox="0 0 1160 620" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="side-panel">
      <div class="tabs">
        <button class="tab active" data-tab="travel" onclick="switchTab('travel')">✈️ 出行</button>
        <button class="tab" data-tab="visa" onclick="switchTab('visa')">🛂 签证</button>
        <button class="tab" data-tab="city" onclick="switchTab('city')">🏙️ 城市</button>
        <button class="tab" data-tab="shop" onclick="switchTab('shop')">🏚️ 历史商店</button>
      </div>
      <div class="tab-body">
        <div id="tab-travel"></div>
        <div id="tab-visa" class="hidden"></div>
        <div id="tab-city" class="hidden"></div>
        <div id="tab-shop" class="hidden"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ 护照模态 ============ -->
<div id="passport-modal" class="modal-bg hidden">
  <div class="modal" style="max-width:620px">
    <div class="modal-head"><h2>📖 我的护照</h2><button class="close-btn" onclick="closePassport()">✕</button></div>
    <div class="modal-body">
      <div class="passport-wrap">
        <div class="passport-cover">
          <div class="ptitle">PASSPORT 护照</div>
          <div class="grid4" id="passport-grid"></div>
        </div>
        <div class="passport-tip">
          <b>贴纸技巧：</b>点击一张贴纸再点击另一格可交换位置。<br>
          🧱 <b>柏林墙</b>：民主德国 ⇄ 联邦德国 贴纸<b>左右相邻</b><br>
          🕊️ <b>三八线</b>：朝鲜 ⇄ 韩国 贴纸<b>上下相邻</b><br>
          出生国护照贴纸固定在第 1 格。
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ 挑战墙模态 ============ -->
<div id="challenge-modal" class="modal-bg hidden">
  <div class="modal">
    <div class="modal-head">
      <h2>🏆 成就挑战墙</h2>
      <span style="color:var(--dim)" id="ch-ov">0/32</span>
      <button class="close-btn" onclick="closeChallenges()">✕</button>
    </div>
    <div class="modal-body" id="challenge-body"></div>
  </div>
</div>

<!-- ============ 入境检查模态 ============ -->
<div id="entry-modal" class="modal-bg hidden">
  <div class="modal" style="max-width:520px">
    <div class="modal-head"><h2>🛃 入境检查</h2><button class="close-btn" onclick="closeEntry()">✕</button></div>
    <div class="modal-body" id="entry-body"></div>
  </div>
</div>

<!-- ============ 胜利 ============ -->
<div id="victory" class="hidden">
  <div class="victory-badge">🎉</div>
  <h1>环球通关！</h1>
  <p>你完成了全部 32 项旅行成就，护照上的每一枚贴纸都在诉说着你的旅程。</p>
  <button class="btn primary" style="padding:12px 40px;font-size:1.1em" onclick="closeVictory()">回顾我的旅程</button>
</div>

<div id="toast"></div>

<script>
"use strict";
/* =====================================================
   数据定义
===================================================== */
const PASSPORTS = [
  {id:'中国',   city:'北京',  color:'#c0392b', note:'可办台胞证/落地入台'},

const CITIES = {

  '长崎':{c:'日本',x:942,y:318,cont:'亚洲',lm:'原爆资料馆'},
  '广岛':{c:'日本',x:966,y:312,cont:'亚洲',lm:'和平纪念公园'},

  '耶路撒冷':{c:'以色列',x:750,y:338,cont:'亚洲',lm:'圣殿山'},

  '基辅':{c:'乌克兰',x:628,y:192,cont:'欧洲',lm:'圣索菲亚大教堂'},
  '柏林':{c:'德国',x:645,y:238,cont:'欧洲',lm:'勃兰登堡门'},
  '巴黎':{c:'法国',x:558,y:258,cont:'欧洲',lm:'埃菲尔铁塔'},

/* =====================================================
   工具函数
===================================================== */
function dist(a,b){const A=CITIES[a],B=CITIES[b];return Math.round(Math.sqrt((A.x-B.x)**2+(A.y-B.y)**2));}
function flightCost(a,b){return Math.max(800,Math.round(dist(a,b)*8));}
function totalCountries(){return new Set(Object.keys(CITIES).map(k=>CITIES[k].c)).size;}
function hasVisa(g,c){return g.stickers.some(s=>s.key===c)||g.passport===c;}
function monthOf(g){return g.date.getMonth()+1;}
function seasonOf(g){const m=monthOf(g);return (m===12||m<=2)?'冬':(m<=5)?'春':(m<=8)?'夏':'秋';}
function fmtMoney(n){return '¥'+Math.round(n).toLocaleString('zh-CN');}
function countryOfCity(city){return CITIES[city].c;}
function orderIn(g,a,b,filter){const idxA=g.travelLog.findIndex(m=>m.to===a&&(!filter||filter(m)));const idxB=g.travelLog.findIndex(m=>m.to===b);return idxA>=0&&idxB>idxA;}
function adjacent(g,keyA,keyB,axis){
  const pa=g.stickers.find(s=>s.key===keyA),pb=g.stickers.find(s=>s.key===keyB);
  if(!pa||!pb)return false;
  const cols=4;
  const ra=Math.floor(pa.pos/cols),ca=pa.pos%cols,rb=Math.floor(pb.pos/cols),cb=pb.pos%cols;
  if(axis==='row')return ra===rb&&Math.abs(ca-cb)===1;
  return ca===cb&&Math.abs(ra-rb)===1;
}
function toast(msg,cls){const el=document.createElement('div');el.className='toast-item '+(cls||'');el.textContent=msg;document.getElementById('toast').appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .4s';setTimeout(()=>el.remove(),400);},2600);}

   游戏状态
===================================================== */
let G=null;

function newGame(passportId,hukou){
  const p=PASSPORTS.find(x=>x.id===passportId);
  const startCity=p.city;
  G={
    passport:p.id, hukou:hukou||'普通', startCity, city:startCity, transitAt:null,
    money:30000, date:new Date(2026,0,1), day:1,
    stickers:[{key:p.id,kind:'passport',pos:0}],
    nextPos:1,
    entryHistory:[], travelLog:[], landmarks:new Set(),
    visitedCities:new Set([startCity]), visitedCountries:new Set([CITIES[startCity].c]),
    visitedCont:new Set([CITIES[startCity].cont]),
    transitStamps:new Set(), unlocked:new Set(),
    russia:{enteredWinter:false,leftBeforeSpring:false},
    flag:{crimea:false,military:false,diplomat:false,salt:false},
  };
  checkAchievements();
  saveGame();
}

/* =====================================================
   移动 / 入境
===================================================== */
function currentVisaPolicy(g,country){
  const pol=COUNTRIES[country];
  if(pol.free.includes(g.passport))return 'free';
  if(pol.arrival.includes(g.passport))return 'arrival';
  return 'required';
}

function doTravel(destCity,mode,purpose){
  const g=G,from=g.city;
  if(destCity===from)return;
  const cost = mode==='转机'?Math.round(flightCost(from,destCity)*0.6):(mode==='飞机'?flightCost(from,destCity):(mode==='陆路'?600:900));
  const days = (mode==='飞机'||mode==='转机')?1:(mode==='陆路'?2:3);
  if(g.money<cost){toast('资金不足，无法出行', 'err');return;}
  g.money-=cost; advance(days);
  g.travelLog.push({from,to:destCity,mode,date:new Date(g.date),purpose});
  if(mode==='转机'){
    const c=countryOfCity(destCity);
    g.transitStamps.add(c);
    g.transitAt=destCity;
    toast('✈️ 转机抵达 '+destCity+' 机场（未入境，获得机场章）');
    renderAll(); saveGame(); checkAchievements();
    return;
  }
  // 到达目的地，进入入境检查
  g._pendingEntry={destCity,mode,purpose};
  openEntryModal(destCity);
}

function entryPolicyText(g,country){
  const pol=currentVisaPolicy(g,country);
  if(pol==='free')return {label:'免签入境',cls:'free',fee:0,desc:'对该护照免签，直接放行'};
  if(pol==='arrival')return {label:'落地签',cls:'arrival',fee:COUNTRIES[country].cost,desc:'可办理落地签 '+fmtMoney(COUNTRIES[country].cost)};
  return {label:'需签证',cls:'need',fee:0,desc:hasVisa(g,country)?'已持有该国签证，可以入境':'未持有该国签证，不可正常入境'};
}

function performEntry(action){
  const g=G,p=g._pendingEntry; if(!p)return;
  const country=countryOfCity(p.destCity);
  const pol=currentVisaPolicy(g,country);
  const c=COUNTRIES[country];
  delete g._pendingEntry;

  if(action==='cancel'){renderAll();return;}

  if(action==='illegal'){
    // 硬闯
    if(Math.random()<0.4){
      doEnter(g,p.destCity,'illegal',p.purpose);
      toast('🕳️ 硬闯入境成功！');
    }else{
      g.money=Math.max(0,g.money-5000);
      g.city=g.startCity;
      toast('🚔 被边境警察逮捕！罚款 ¥5,000 并被遣返回 '+g.startCity,'err');
    }
    renderAll();saveGame();checkAchievements();return;
  }

  if(action==='legal'){
    // 台湾地区居民持台胞证入境中国大陆（免签政策之外的特殊安排）
    if(country==='中国'&&g.passport==='台湾地区'&&!hasVisa(g,'中国')){addSticker(g,'中国','visa');toast('🪪 签发台胞证（视为中国签证贴纸）');}
    if(pol==='arrival'){
      if(g.money<c.cost){toast('资金不足办理落地签','err');return;}
      g.money-=c.cost;
      addSticker(g,country,'visa');
    }
    if(pol==='required'&&!hasVisa(g,country)){toast('没有签证，无法正常入境','err');return;}
    if(pol==='free'&&country==='中国'&&g.passport==='台湾地区'&&!hasVisa(g,'中国')){addSticker(g,'中国','visa');toast('🪪 签发台胞证（视为中国签证贴纸）');}
    doEnter(g,p.destCity,'legal',p.purpose);
    renderAll();saveGame();checkAchievements();
  }
}

function doEnter(g,city,mode,purpose){
  const country=countryOfCity(city);
  const entry={city,country,date:new Date(g.date),mode,purpose,prevCity:g.city,prevCountry:countryOfCity(g.city)};
  g.entryHistory.push(entry);
  g.transitAt=null;
  g.city=city;
  g.visitedCities.add(city);
  g.visitedCountries.add(country);
  g.visitedCont.add(CITIES[city].cont);
  // 俄罗斯冬将军记录
  if(country==='俄罗斯'&&[12,1,2].includes(monthOf(g)))g.russia.enteredWinter=true;
  if(purpose==='外交')g.flag.diplomat=true;
  toast('🛬 入境 '+country+' · '+city+(mode==='illegal'?'（偷渡）':''));
  checkAchievements();
}

/* 离境检测：在 travelLog 中，从俄罗斯城市离开且发生在冬季 */
function updateRussiaLeave(g){
  for(const m of g.travelLog){
    if(countryOfCity(m.from)==='俄罗斯'&&[12,1,2].includes(m.date.getMonth()+1))g.russia.leftBeforeSpring=true;
  }
}

/* =====================================================
   签证
===================================================== */
function addSticker(g,key,kind){
  if(g.stickers.some(s=>s.key===key))return;
  g.stickers.push({key,kind,pos:g.nextPos++});
  if(g.nextPos>=12){ // 护照页满，翻页（重新整理到第二页：简单扩容位置）
  }
}
function policyOfPassportFor(g,country){
  const pol=currentVisaPolicy(g,country);
  if(hasVisa(g,country))return 'owned';
  return pol;
}

function applyVisa(country){
  const g=G;
  if(hasVisa(g,country))return;
  // 台湾地区居民申请"中国签证"= 签发台胞证
  if(country==='中国'&&g.passport==='台湾地区'){addSticker(g,'中国','visa');toast('🪪 签发台胞证');renderAll();saveGame();checkAchievements();return;}
  const c=COUNTRIES[country];
  const pol=currentVisaPolicy(g,country);
  if(pol==='free'){addSticker(g,country,'visa');toast('🛂 免签国，直接获得入境贴纸');renderAll();saveGame();checkAchievements();return;}
  if(g.money<c.cost){toast('资金不足','err');return;}
  // 克里米亚/特别军事行动 邀请函
  if(country==='乌克兰'&&hasVisa(g,'俄罗斯')&&!g.flag.crimea){g.flag.crimea=true;toast('📄 提交了俄罗斯的邀请函（克里米亚危机条件已满足）','ach');}
  if(country==='俄罗斯'&&hasVisa(g,'乌克兰')&&!g.flag.military){g.flag.military=true;toast('💥 提交了乌克兰的邀请函（特别军事行动条件已满足）','ach');}
  g.money-=c.cost;
  toast('🛂 已提交 '+country+' 签证申请，审批约 '+c.days+' 天，成功率 '+(c.rate*100).toFixed(0)+'%');
  advance(c.days);
  if(Math.random()<c.rate){
    addSticker(g,country,'visa');
    toast('✅ '+country+' 签证获批！');
  }else{
    toast('❌ '+country+' 签证被拒，可重新申请','err');
  }
  renderAll();saveGame();checkAchievements();
}

function buyHistoric(key){
  const g=G;
  if(hasVisa(g,key)){toast('已拥有该贴纸');return;}
  const h=HISTORIC[key];
  if(g.money<h.cost){toast('资金不足','err');return;}
  g.money-=h.cost; advance(h.days);
  if(Math.random()<h.rate){
    addSticker(g,key,'historic');
    toast('🏚️ 获得历史签证贴纸：'+key+'！','ach');
  }else{
    toast('❌ 收藏家拒绝了这次交易（'+key+' 获取失败）','err');
  }
  renderAll();saveGame();checkAchievements();
}

/* =====================================================
   时间 / 经济
===================================================== */
function advance(days){
  G.date.setDate(G.date.getDate()+days);
  G.day+=days;
  updateRussiaLeave(G);
}
function workDay(){
  if(G.money<0){}
  G.money+=2500; advance(1);
  toast('💼 打零工 1 天，收入 ¥2,500');
  renderAll();saveGame();
}
function visitLandmark(){
  const g=G,city=g.city;
  const lm=CITIES[city].lm;
  if(g.landmarks.has(lm)){toast('已经游览过这里了');return;}
  g.landmarks.add(lm); advance(1);
  toast('📸 游览 '+lm);
  renderAll();saveGame();checkAchievements();
}
function doSalt(){
  const g=G;
  if(g.city!=='突尼斯')return;
  if(g.flag.salt){toast('已经撒过盐了');return;}
  g.flag.salt=true;
  toast('🧂 在迦太基遗址的土地上撒了一把盐……');
  renderAll();saveGame();checkAchievements();
}

/* =====================================================
   挑战检测
===================================================== */
function checkAchievements(){
  if(!G)return;
  let newCount=0;
  for(const a of ACHIEVEMENTS){
    if(!G.unlocked.has(a.id)){
      try{
        if(a.check(G)){
          G.unlocked.add(a.id);
          G.money+=2000;
          newCount++;
          toast('🏆 成就解锁：【'+a.title+'】 +¥2,000','ach');
        }
      }catch(e){console.error('ach check error',a.id,e);}
    }
  }
  if(newCount>0){renderAll();saveGame();}
  if(G.unlocked.size>=ACHIEVEMENTS.length){showVictory();}
}

}

function switchTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  ['travel','visa','city','shop'].forEach(id=>document.getElementById('tab-'+id).classList.toggle('hidden',id!==t));
}

let selDest=null, selMode='飞机', selPurpose='旅游';
function selectDest(name){
  selDest=name;
  switchTab('travel');
  renderTravelTab();
}
function setMode(m){selMode=m;renderTravelTab();}
function setPurpose(p){selPurpose=p;renderTravelTab();}

function renderTravelTab(){
  const g=G,el=document.getElementById('tab-travel');
  const inTransit=!!g.transitAt;
  let s='';
  s+=`<div class="city-info"><div class="nm">${g.transitAt?('✈️ 机场过境 · '+g.transitAt):('📍 '+g.city)}</div><div class="meta">国家：${countryOfCity(g.transitAt||g.city)} · ${seasonOf(g)}季 · 已有 ¥${fmtMoney(g.money)}</div></div>`;
  if(inTransit){
    s+=`<button class="btn primary" style="width:100%;margin-bottom:10px" onclick="enterFromTransit()">🛃 办理入境（离开机场）</button>`;
    s+='<div class="small-note" style="margin-bottom:10px">转机只获得机场章。办理入境后按正常签证政策检查。</div>';
  }
  s+=`<h3>选择目的地</h3><ul class="dest-list">`;
  const from=g.transitAt||g.city;
  for(const name of Object.keys(CITIES)){
    if(name===from)continue;
    const c=CITIES[name];
    const canLand=LAND_LINKS.some(l=>(l[0]===from&&l[1]===name)||(l[0]===name&&l[1]===from));
    const canSea=SEA_LINKS.some(l=>(l[0]===from&&l[1]===name)||(l[0]===name&&l[1]===from));
    const pol=currentVisaPolicy(g,c.c);
    const polTxt=pol==='free'?'免签':pol==='arrival'?'落地签':(hasVisa(g,c.c)?'有签证':'需签证');
    const d=dist(from,name);
    s+=`<li class="${selDest===name?'sel':''}" onclick="selectDest('${name}')"><div><div class="dn">${name} <span style="color:var(--faint);font-size:.78em">${c.c} · ${c.cont}</span></div><div class="dm" style="text-align:left">${polTxt} · 飞¥${flightCost(from,name).toLocaleString()}${canLand?' · 陆¥600':''}${canSea?' · 海¥900':''}</div></div><div style="font-size:1.3em">${isVisitedDot(name)}</div></li>`;
  }
  s+='</ul>';
  if(!inTransit){
    s+='<div class="mode-row">';
    s+=`<button class="mode-btn ${selMode==='飞机'?'sel':''}" onclick="setMode('飞机')">✈️ 飞机(1天)</button>`;
    s+=`<button class="mode-btn ${selMode==='陆路'?'sel':''}" ${canLandAny(from)?'':'disabled'} onclick="setMode('陆路')">🚂 陆路(2天)</button>`;
    s+=`<button class="mode-btn ${selMode==='海路'?'sel':''}" ${canSeaAny(from)?'':'disabled'} onclick="setMode('海路')">⛴️ 海路(3天)</button>`;
    s+=`<button class="mode-btn ${selMode==='转机'?'sel':''}" onclick="setMode('转机')">✈️ 转机过境</button>`;
    s+='</div>';
    s+='<div class="purpose-row">';
    for(const p of ['旅游','商务','外交']){
      s+=`<button class="purpose-btn ${selPurpose===p?'sel':''}" onclick="setPurpose('${p}')">${p==='旅游'?'🎒':p==='商务'?'📊':'💼'} ${p}</button>`;
    }
    s+='</div>';
  }
  if(selDest&&selDest!==from){
    const dd=dist(from,selDest);
    const canLand=LAND_LINKS.some(l=>(l[0]===from&&l[1]===selDest)||(l[0]===selDest&&l[1]===from));
    const canSea=SEA_LINKS.some(l=>(l[0]===from&&l[1]===selDest)||(l[0]===selDest&&l[1]===from));
    let mode=selMode;
    if(inTransit)mode='转机';
    else if(mode==='陆路'&&!canLand)mode='飞机';
    else if(mode==='海路'&&!canSea)mode='飞机';
    const cost=mode==='飞机'?flightCost(from,selDest):(mode==='陆路'?600:900);
    s+=`<button class="btn primary" style="width:100%;margin-top:10px;font-size:1.05em" onclick="doTravel('${selDest}','${mode}','${selPurpose}')">出发：${from} → ${selDest}（${mode}，${fmtMoney(cost)}，${mode==='飞机'?1:mode==='陆路'?2:3}天）</button>`;
    if(mode==='转机')s+='<div class="small-note">转机获得目的地国家机场章，不入境。</div>';
    if(mode!=='转机')s+=`<div class="small-note">入境目的：${selPurpose}</div>`;
  }
  el.innerHTML=s;
}
function canLandAny(from){return LAND_LINKS.some(l=>l[0]===from||l[1]===from);}
function canSeaAny(from){return SEA_LINKS.some(l=>l[0]===from||l[1]===from);}
function isVisitedDot(name){return G.visitedCities.has(name)?'✅':'';}

function enterFromTransit(){
  const g=G; if(!g.transitAt)return;
  g._pendingEntry={destCity:g.transitAt,mode:'飞机',purpose:'旅游'};
  openEntryModal(g.transitAt);
}

    s+=`<div class="shop-item"><h4><span class="visa-dot" style="background:${h.color};width:26px;height:18px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:6px;border:1px solid rgba(255,255,255,.25)"></span>${key}</h4><p>${h.note}</p><div><span class="cost">${fmtMoney(h.cost)}</span> · ${h.days}天 · 成功率${(h.rate*100).toFixed(0)}%  ${owned?'<span class="tag owned">已收藏</span>':''}</div>${owned?'':`<button class="btn gold" style="margin-top:6px" onclick="buyHistoric('${key}')">购买贴纸</button>`}</div>`;
  }
  s+='<div class="small-note">苏联 / 民主德国 / 联邦德国 / 中华民国(1912-1949) / 法兰西第四共和国 —— 历史收藏品</div>';
  el.innerHTML=s;
}

function renderPassport(){
  const el=document.getElementById('passport-grid');
  if(!el)return;
  const g=G;
  const cells=[];
  for(let i=0;i<12;i++){
    const st=g.stickers.find(s=>s.pos===i);
    if(!st){cells.push(`<div class="cell empty" onclick="passportClick(null,${i})">空</div>`);continue;}
    const color=st.kind==='passport'?PASSPORTS.find(p=>p.id===st.key)?.color||'#555':(HISTORIC[st.key]?HISTORIC[st.key].color:COUNTRIES[st.key]?.color||'#555');
    const code=st.kind==='passport'?'护照':(HISTORIC[st.key]?'历史':'签证');
    cells.push(`<div class="cell ${selSticker===st.key?'sel':''}" onclick="passportClick('${st.key}',${i})"><div class="cd" style="background:${color}"><b>${st.key.length>6?st.key.slice(0,5)+'…':st.key}</b><small>${code}${st.key==='中国'&&g.passport==='台湾地区'&&st.kind==='visa'?'(台胞证)':''}</small></div></div>`);
  }
  el.innerHTML=cells.join('');
}
let selSticker=null;
function passportClick(key,pos){
  if(key===null){if(selSticker){const st=G.stickers.find(s=>s.key===selSticker);if(st){if(st.key===G.passport&&st.pos===0){toast('出生国护照贴纸固定在第 1 格');selSticker=null;renderPassport();return;}st.pos=pos;selSticker=null;renderPassport();saveGame();checkAchievements();toast('📖 贴纸已移动到新位置');}}return;}
  if(key===G.passport&&G.stickers.find(s=>s.key===key).pos===0){toast('出生国护照贴纸固定在第 1 格');return;}
  if(selSticker===null){selSticker=key;renderPassport();}
  else if(selSticker===key){selSticker=null;renderPassport();}
  else{
    const a=G.stickers.find(s=>s.key===selSticker),b=G.stickers.find(s=>s.key===key);
    if(a&&b){const t=a.pos;a.pos=b.pos;b.pos=t;}
    selSticker=null;renderPassport();saveGame();checkAchievements();
  }
}

function renderChallenges(){
  const el=document.getElementById('challenge-body');
  if(!el)return;
  const g=G;
  document.getElementById('ch-ov').textContent=g.unlocked.size+'/32';
  let s='';
  for(const ser of SERIES){
    const list=ACHIEVEMENTS.filter(a=>a.series===ser.id);
    const done=list.filter(a=>g.unlocked.has(a.id)).length;
    s+=`<div class="series-box"><div class="series-head" onclick="toggleSeries('${ser.id}')"><h3>${ser.name}</h3><span class="sc">${done}/${list.length}</span></div><div class="series-body" id="sb-${ser.id}"><div class="ach-grid">`;
    for(const a of list){
      const u=g.unlocked.has(a.id);
      s+=`<div class="ach-card ${u?'unlocked':''}"><div class="ic">${a.icon}</div><div class="at">${a.title}</div><div class="ad">${a.desc}</div></div>`;
    }
    s+='</div></div></div>';
  }
  el.innerHTML=s;
}
function toggleSeries(id){
  const b=document.getElementById('sb-'+id);
  b.classList.toggle('collapsed');
}
function openPassport(){document.getElementById('passport-modal').classList.remove('hidden');renderPassport();}
function closePassport(){document.getElementById('passport-modal').classList.add('hidden');selSticker=null;}
function openChallenges(){document.getElementById('challenge-modal').classList.remove('hidden');renderChallenges();}
function closeChallenges(){document.getElementById('challenge-modal').classList.add('hidden');}
function openEntryModal(city){
  const g=G,country=countryOfCity(city);
  const pol=currentVisaPolicy(g,country);
  const c=COUNTRIES[country];
  const el=document.getElementById('entry-body');
  let s=`<div class="entry-box"><div class="big">🛃 ${city} · ${country}</div><div class="pol">当前身份：${g.passport}护照${g.hukou!=='普通'?'（'+g.hukou+'户籍）':''}</div>`;
  if(pol==='free'){s+=`<div class="pol" style="color:var(--green)">✅ 免签入境</div><div class="fee">费用：免费</div>`;}
  else if(pol==='arrival'){s+=`<div class="pol" style="color:var(--orange)">🛂 落地签（可现场办理）</div><div class="fee">费用：${fmtMoney(c.cost)}</div>`;}
  else if(hasVisa(g,country)){s+=`<div class="pol" style="color:var(--green)">✅ 已持有 ${country} 签证</div>`;}
  else{s+=`<div class="pol" style="color:var(--red)">⛔ 未持有 ${country} 签证</div><div class="fee">正常入境将被拒绝，但可以硬闯（成功率40%，失败罚款¥5,000遣返）</div>`;}
  s+='</div>';
  s+='<div style="margin-bottom:10px"><div style="color:var(--dim);font-size:.9em;margin-bottom:6px">入境目的：</div><div class="purpose-row">';
  for(const p of ['旅游','商务','外交']){
    s+=`<button class="purpose-btn ${selPurpose===p?'sel':''}" onclick="setPurpose('${p}')">${p}</button>`;
  }
  s+='</div><div class="small-note">💼 选择"外交"入境可解锁成就「临时工」。</div></div>';
  if(pol==='free'||pol==='arrival'||hasVisa(g,country)){
    s+=`<button class="btn primary" style="width:100%;margin-bottom:6px" onclick="performEntry('legal')">✅ 正常入境${pol==='arrival'?'（支付落地签费用）':''}</button>`;
  }
  if(pol==='required'&&!hasVisa(g,country)){
    s+=`<button class="btn danger" style="width:100%;margin-bottom:6px" onclick="performEntry('illegal')">🕳️ 硬闯入境（40%）</button>`;
    s+=`<button class="btn" style="width:100%;margin-bottom:6px" onclick="closeEntry();switchTab('visa')">去签证中心申请签证</button>`;
  }
  s+=`<button class="btn" style="width:100%" onclick="performEntry('cancel')">取消出行（留在 ${g.city}）</button>`;
  el.innerHTML=s;
  document.getElementById('entry-modal').classList.remove('hidden');
}
function closeEntry(){document.getElementById('entry-modal').classList.add('hidden');}

function showVictory(){
  if(!document.getElementById('victory').classList.contains('hidden'))return;
  document.getElementById('victory').classList.remove('hidden');
}
function closeVictory(){document.getElementById('victory').classList.add('hidden');}

/* =====================================================
   存档
===================================================== */
const SAVE_KEY='globalPassportSave_v1';
function saveGame(){
  if(!G)return;
  try{
    const data={...G,date:G.date.toISOString(),visitedCities:[...G.visitedCities],visitedCountries:[...G.visitedCountries],visitedCont:[...G.visitedCont],landmarks:[...G.landmarks],transitStamps:[...G.transitStamps],unlocked:[...G.unlocked]};
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
  }catch(e){console.warn('save failed',e);}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const d=JSON.parse(raw);
    G={...d,date:new Date(d.date),visitedCities:new Set(d.visitedCities),visitedCountries:new Set(d.visitedCountries),visitedCont:new Set(d.visitedCont),landmarks:new Set(d.landmarks),transitStamps:new Set(d.transitStamps),unlocked:new Set(d.unlocked)};
    return true;
  }catch(e){console.warn('load failed',e);return false;}
}

/* =====================================================
   启动
===================================================== */
function initStart(){
  const row=document.getElementById('flag-row');
  let s='';
  for(const p of PASSPORTS){
    s+=`<div class="flag-card" id="fc-${p.id}" onclick="selectFlag('${p.id}')"><div class="flag-dot" style="background:${p.color}"></div><b>${p.id}</b><small>${p.city}</small><small>${p.note}</small></div>`;
  }
  row.innerHTML=s;
}
let selFlag='中国';
function selectFlag(id){
  selFlag=id;
  document.querySelectorAll('.flag-card').forEach(el=>el.classList.toggle('sel',el.id==='fc-'+id));
  document.getElementById('hukou-wrap').classList.toggle('hidden',id!=='中国');
  if(id!=='中国')selHukou='普通';
  renderHukou();
}
let selHukou='普通';
function renderHukou(){
  const row=document.getElementById('hukou-row');
  let s='';
  for(const h of ['普通','福建','广东','海南']){
    s+=`<button class="hukou-btn ${selHukou===h?'sel':''}" onclick="selHukou='${h}';renderHukou()">${h==='普通'?'普通户籍':'🗺️ '+h}</button>`;
  }
  row.innerHTML=s;
}

function startGame(){
  newGame(selFlag,selFlag==='中国'?selHukou:'普通');
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  renderAll();
  toast('🌍 旅程开始！你在 '+G.city+'（'+G.passport+'护照）');
}
function continueGame(){
  if(!loadGame())return;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  renderAll();
  toast('🔄 已读取存档');
}
function confirmNewGame(){
  if(confirm('确定要放弃当前旅程重新开始吗？进度将被覆盖。')){startGame();}
}

document.addEventListener('DOMContentLoaded',function(){
  initStart();
  renderHukou();
  document.getElementById('btn-start').addEventListener('click',startGame);
  document.getElementById('btn-continue').addEventListener('click',continueGame);
  if(localStorage.getItem(SAVE_KEY))document.getElementById('btn-continue').classList.remove('hidden');
  document.querySelectorAll('.modal-bg').forEach(m=>{m.addEventListener('click',function(e){if(e.target===m){m.classList.add('hidden');}});});
  switchTab('travel');
});
</script>
